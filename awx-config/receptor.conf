---
# Minimal Receptor config for the standalone AWX lab. The AWX operator
# normally generates this; awx-task's dispatcher refuses to start without it.
# Node id must match CLUSTER_HOST_ID so AWX recognizes itself on the mesh.
- node:
    id: awx

- log-level:
    level: info

- local-only: null

- control-service:
    service: control
    filename: /var/run/receptor/receptor.sock
    permissions: 0660

- work-command:
    worktype: local
    command: ansible-runner
    params: worker
    allowruntimeparams: true
