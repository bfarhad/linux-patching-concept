---
- name: Enterprise Multi-Distro Linux Patch Management Playbook
  hosts: linux_cluster
  become: yes
  gather_facts: yes
  any_errors_fatal: false

  tasks:
    - name: Display current node OS details
      ansible.builtin.debug:
        msg: "Managing patching for {{ inventory_hostname }} running {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Apply patches (RedHat family - dnf security update)
      when: ansible_os_family == "RedHat"
      block:
        - name: Update RedHat / Rocky Linux packages (security focused)
          ansible.builtin.dnf:
            name: "*"
            state: latest
            security: yes
          register: patch_result

        - name: Record success
          ansible.builtin.set_fact:
            patch_status: success
            patch_changed: "{{ patch_result.changed }}"
            patch_message: "Patched successfully ({{ 'packages updated' if patch_result.changed else 'already up to date' }})"
      rescue:
        - name: Record failure
          ansible.builtin.set_fact:
            patch_status: failed
            patch_changed: false
            patch_message: "{{ ansible_failed_result.msg | default('dnf update failed') }}"

    - name: Apply patches (Debian family - apt safe upgrade)
      when: ansible_os_family == "Debian"
      block:
        - name: Update package cache and apply safe upgrade
          ansible.builtin.apt:
            update_cache: yes
            upgrade: safe
          register: patch_result

        - name: Record success
          ansible.builtin.set_fact:
            patch_status: success
            patch_changed: "{{ patch_result.changed }}"
            patch_message: "Patched successfully ({{ 'packages updated' if patch_result.changed else 'already up to date' }})"
      rescue:
        - name: Record failure
          ansible.builtin.set_fact:
            patch_status: failed
            patch_changed: false
            patch_message: "{{ ansible_failed_result.msg | default('apt upgrade failed') }}"

    - name: Record unsupported OS family
      ansible.builtin.set_fact:
        patch_status: skipped
        patch_changed: false
        patch_message: "Unsupported OS family '{{ ansible_os_family }}' - no patch strategy defined"
      when: ansible_os_family not in ["RedHat", "Debian"]

    - name: Check if reboot is required (RedHat family)
      ansible.builtin.command: dnf needs-restarting -r
      register: rhel_reboot_check
      failed_when: false
      changed_when: false
      when:
        - ansible_os_family == "RedHat"
        - patch_status == "success"

    - name: Check if reboot is required (Debian family)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: debian_reboot_check
      when:
        - ansible_os_family == "Debian"
        - patch_status == "success"

    - name: Record reboot requirement
      ansible.builtin.set_fact:
        reboot_required: >-
          {{
            (ansible_os_family == "RedHat" and rhel_reboot_check is defined and rhel_reboot_check.rc == 1)
            or
            (ansible_os_family == "Debian" and debian_reboot_check is defined and debian_reboot_check.stat.exists | default(false))
          }}

    # NOTE: the actual reboot is intentionally NOT executed here. Rebooting a
    # container kills its PID 1 (sshd) and, unless the compose service has a
    # restart policy, the node will not come back on its own - stranding
    # this lab's SSH access. `reboot_required` is reported in the summary
    # below so you can see exactly which nodes would need one; wire in
    # ansible.builtin.reboot (gated on this fact) when targeting real
    # VMs/bare metal instead of lab containers.

- name: Generate consolidated fleet patch report
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    report_dir: "{{ playbook_dir }}/../reports"
    report_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

  tasks:
    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"

    - name: Assemble per-host patch rows
      ansible.builtin.set_fact:
        patch_rows: "{{ patch_rows | default([]) + [{
          'host': item,
          'distribution': (hostvars[item].ansible_distribution | default('unknown')) ~ ' ' ~ (hostvars[item].ansible_distribution_version | default('')),
          'status': hostvars[item].patch_status | default('unknown'),
          'changed': hostvars[item].patch_changed | default(false),
          'reboot_required': hostvars[item].reboot_required | default(false),
          'message': hostvars[item].patch_message | default('no result recorded')
          }] }}"
      loop: "{{ groups['linux_cluster'] }}"

    - name: Print fleet patch summary
      ansible.builtin.debug:
        msg: "{{ '%-14s %-22s %-8s %-9s %-9s %s' | format(item.host, item.distribution, item.status, ('changed' if item.changed else 'no-op'), ('reboot' if item.reboot_required else 'ok'), item.message) }}"
      loop: "{{ patch_rows }}"
      loop_control:
        label: "{{ item.host }}"

    - name: Write JSON patch report
      ansible.builtin.copy:
        content: "{{ patch_rows | to_nice_json }}\n"
        dest: "{{ report_dir }}/patch_report_{{ report_timestamp }}.json"

    - name: Identify hosts that failed to patch
      ansible.builtin.set_fact:
        failed_hosts: "{{ patch_rows | selectattr('status', 'equalto', 'failed') | map(attribute='host') | list }}"

    - name: Fail the run if any node failed to patch
      ansible.builtin.fail:
        msg: "Patch run finished with failures on: {{ failed_hosts | join(', ') }}. See {{ report_dir }}/patch_report_{{ report_timestamp }}.json for details."
      when: failed_hosts | length > 0
