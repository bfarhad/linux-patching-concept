---
- name: Enterprise Multi-Distro Linux Patch Management Playbook
  hosts: linux_cluster
  become: yes
  gather_facts: yes
  any_errors_fatal: false

  tasks:
    - name: Display current node OS details
      ansible.builtin.debug:
        msg: "Managing patching for {{ inventory_hostname }} running {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Apply patches (RedHat family - dnf security update)
      when: ansible_os_family == "RedHat"
      block:
        - name: Update RedHat / Rocky Linux packages (security focused)
          ansible.builtin.dnf:
            name: "*"
            state: latest
            security: yes
          register: patch_result

        - name: Record success
          ansible.builtin.set_fact:
            patch_status: success
            patch_changed: "{{ patch_result.changed }}"
            patch_message: "Patched successfully ({{ 'packages updated' if patch_result.changed else 'already up to date' }})"
      rescue:
        - name: Record failure
          ansible.builtin.set_fact:
            patch_status: failed
            patch_changed: false
            patch_message: "{{ ansible_failed_result.msg | default('dnf update failed') }}"

    - name: Apply patches (Debian family - apt safe upgrade)
      when: ansible_os_family == "Debian"
      block:
        - name: Update package cache and apply safe upgrade
          ansible.builtin.apt:
            update_cache: yes
            upgrade: safe
          register: patch_result

        - name: Record success
          ansible.builtin.set_fact:
            patch_status: success
            patch_changed: "{{ patch_result.changed }}"
            patch_message: "Patched successfully ({{ 'packages updated' if patch_result.changed else 'already up to date' }})"
      rescue:
        - name: Record failure
          ansible.builtin.set_fact:
            patch_status: failed
            patch_changed: false
            patch_message: "{{ ansible_failed_result.msg | default('apt upgrade failed') }}"

    - name: Record unsupported OS family
      ansible.builtin.set_fact:
        patch_status: skipped
        patch_changed: false
        patch_message: "Unsupported OS family '{{ ansible_os_family }}' - no patch strategy defined"
      when: ansible_os_family not in ["RedHat", "Debian"]

    # `dnf needs-restarting` lives in dnf-plugins-core. Without it dnf exits 1
    # ("No such command"), which would be misread as "reboot required".
    - name: Ensure needs-restarting is available (RedHat family)
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present
      failed_when: false
      when:
        - ansible_os_family == "RedHat"
        - patch_status == "success"

    - name: Check if reboot is required (RedHat family)
      ansible.builtin.command: dnf needs-restarting -r
      register: rhel_reboot_check
      failed_when: false
      changed_when: false
      when:
        - ansible_os_family == "RedHat"
        - patch_status == "success"

    - name: Check if reboot is required (Debian family)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: debian_reboot_check
      when:
        - ansible_os_family == "Debian"
        - patch_status == "success"

    # Skipped tasks still register a variable (without rc/stat), so every
    # lookup below is defaulted - otherwise a failed RedHat patch would make
    # `rhel_reboot_check.rc` blow up with "has no attribute 'rc'".
    - name: Record reboot requirement
      ansible.builtin.set_fact:
        reboot_required: >-
          {{
            (ansible_os_family == "RedHat" and (rhel_reboot_check.rc | default(0)) == 1)
            or
            (ansible_os_family == "Debian" and (debian_reboot_check.stat.exists | default(false)))
          }}

    # NOTE: the actual reboot is intentionally NOT executed here. Rebooting a
    # container kills its PID 1 (sshd) and, unless the compose service has a
    # restart policy, the node will not come back on its own - stranding
    # this lab's SSH access. `reboot_required` is reported in the summary
    # below so you can see exactly which nodes would need one; wire in
    # ansible.builtin.reboot (gated on this fact) when targeting real
    # VMs/bare metal instead of lab containers.

- name: Generate consolidated fleet patch report
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    # Override with -e patch_report_dir=/some/path (e.g. a mounted volume in AWX).
    # In AWX the default lands in the job's throwaway private data dir, so the
    # report is also published as job artifacts via set_stats below.
    report_dir: "{{ patch_report_dir | default(playbook_dir ~ '/../reports') }}"

  tasks:
    # Evaluate the timestamp ONCE. As a play var it is lazily re-evaluated on
    # every use, so the file name and the failure message could differ.
    - name: Freeze report timestamp
      ansible.builtin.set_fact:
        report_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"

    - name: Assemble per-host patch rows
      ansible.builtin.set_fact:
        patch_rows: "{{ patch_rows | default([]) + [{
          'host': item,
          'distribution': (hostvars[item].ansible_distribution | default('unknown')) ~ ' ' ~ (hostvars[item].ansible_distribution_version | default('')),
          'status': hostvars[item].patch_status | default('unreachable'),
          'changed': hostvars[item].patch_changed | default(false),
          'reboot_required': hostvars[item].reboot_required | default(false),
          'message': hostvars[item].patch_message | default('no result recorded (host unreachable or play aborted)')
          }] }}"
      loop: "{{ groups['linux_cluster'] | default([]) }}"

    - name: Print fleet patch summary
      ansible.builtin.debug:
        msg: "{{ '%-14s %-22s %-11s %-9s %-9s %s' | format(item.host, item.distribution, item.status, ('changed' if item.changed else 'no-op'), ('reboot' if item.reboot_required else 'ok'), item.message) }}"
      loop: "{{ patch_rows | default([]) }}"
      loop_control:
        label: "{{ item.host }}"

    - name: Write JSON patch report
      ansible.builtin.copy:
        content: "{{ patch_rows | default([]) | to_nice_json }}\n"
        dest: "{{ report_dir }}/patch_report_{{ report_timestamp }}.json"

    # Shows up under the AWX job's "Artifacts" and is passed to later
    # workflow nodes (e.g. a notification / ticketing step).
    - name: Publish report as AWX job artifacts
      ansible.builtin.set_stats:
        data:
          patch_report: "{{ patch_rows | default([]) }}"
          patch_report_timestamp: "{{ report_timestamp }}"
        per_host: false

    - name: Identify hosts that failed to patch (incl. unreachable)
      ansible.builtin.set_fact:
        failed_hosts: "{{ patch_rows | default([]) | selectattr('status', 'in', ['failed', 'unreachable']) | map(attribute='host') | list }}"

    - name: Fail the run if any node failed to patch
      ansible.builtin.fail:
        msg: "Patch run finished with failures on: {{ failed_hosts | join(', ') }}. See {{ report_dir }}/patch_report_{{ report_timestamp }}.json for details."
      when: failed_hosts | length > 0