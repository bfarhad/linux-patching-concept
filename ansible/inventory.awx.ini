# Use this inventory when running the playbook FROM the AWX task container
# (or any host attached to the "lab-net" Docker network). AWX reaches the
# fleet nodes by their internal container hostnames on port 22, rather than
# via the host-mapped ports used by ansible-cli-from-the-Mac (inventory.ini).
[linux_cluster]
rhel-node   ansible_host=rhel-node   ansible_user=root
ubuntu-node ansible_host=ubuntu-node ansible_user=root
debian-node ansible_host=debian-node ansible_user=root

[linux_cluster:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_ssh_private_key_file=/etc/awx-ssh/id_rsa_ansible
