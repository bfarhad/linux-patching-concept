# podman-in-docker settings: no systemd/journald inside the container, and
# share the receptor container's network namespace so job containers reach
# rhel-node/ubuntu-node/debian-node through Docker DNS on lab-net.
#
# cgroups = "disabled": under cgroup v2, podman's cgroupfs manager tries to
# create /libpod_parent and enable controllers in the receptor container's
# cgroup root, which the kernel refuses while receptor's own processes live
# there ("Failed to add conmon to cgroupfs sandbox cgroup ... container
# create failed"). Job containers simply stay in awx-receptor's cgroup.
[containers]
netns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
